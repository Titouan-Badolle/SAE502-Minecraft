---
# Variables communes du projet (non secrètes).
# Les secrets sont dans vault.yml (chiffré avec ansible-vault).

infra_dir: /opt/infra_mc
backup_dir: /var/backups/infra_mc
backup_hour: "3"            # sauvegarde quotidienne à 3 h (peu de joueurs)
backup_retention_days: 7

# Clés publiques autorisées à se connecter en SSH (la clé publique n'est pas un secret)
ssh_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE2obvYBXGI+ofc7JmutcdAMoDyB4/u8c8UKV3xPmjl8 ansible@wsl-titouan"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKZbt4MJgHDkVpg7oJW7CwhLnvv4L8c4sn3rjAP8omoO termius-titouan"

# Réseau Docker dédié, hors du réseau de l'IUT (192.168.112.0/20)
infra_network: infra_mc
infra_subnet: 172.30.52.0/24
infra_gateway: 172.30.52.1

# Adresses fixes des conteneurs sur infra_mc
proxy_ip: 172.30.52.11
serveur_ip: 172.30.52.12
db_ip: 172.30.52.13
monitoring_ip: 172.30.52.14

# Images Docker (versions figées pour un déploiement reproductible)
proxy_image: nginx:1.28-alpine
db_image: mariadb:11.4
grafana_image: grafana/grafana:12.0.0
prometheus_image: prom/prometheus:v3.5.0
node_exporter_image: prom/node-exporter:v1.9.1
mysqld_exporter_image: prom/mysqld-exporter:v0.17.2
# Image de référence pour Minecraft : télécharge Paper et les plugins demandés
serveur_image: itzg/minecraft-server:java21

# CT-serveur (PaperMC)
mc_version: "1.21.8"
mc_memory: 1536M

# CT-db
db_name: luckperms
db_user: luckperms
